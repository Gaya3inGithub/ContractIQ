version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: contractiq-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: accord
      MYSQL_DATABASE: contractiq_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-paccord"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: contractiq-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/contractiq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: accord
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 15
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - contract_uploads:/app/uploads

volumes:
  mysql_data:
  contract_uploads:
